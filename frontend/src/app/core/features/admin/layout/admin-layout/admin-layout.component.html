<div class="admin-shell">
    <app-header mode="admin" (toggleSidebar)="toggleSidebar()" />
    <div class="admin-body" [class.sidebar-open]="sidebarOpen">
        @if (sidebarOpen) {
            <div class="sidebar-backdrop d-md-none"></div>
        }
        <aside class="sidebar" [class.open]="sidebarOpen">
            <nav class="sidebar-nav">
                <a class="nav-item" routerLink="/admin/dashboard" routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: true}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                    Dashboard
                </a>
                <a class="nav-item" routerLink="/admin/events" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    Events
                </a>
                <a class="nav-item" routerLink="/admin/categories" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16v4H4z" />
                        <path d="M4 12h16v4H4z" />
                        <path d="M4 20h8v4H4z" />
                    </svg>
                    Categories
                </a>
                <!-- <a class="nav-item" routerLink="/admin/users" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    Users
                </a> -->
                <a class="nav-item" routerLink="/admin/bookings" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="18" rx="2" />
                        <line x1="3" y1="10" x2="21" y2="10" />
                        <line x1="12" y1="2" x2="12" y2="6" />
                    </svg>
                    Bookings
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <router-outlet />
        </main>
    </div>
</div>
