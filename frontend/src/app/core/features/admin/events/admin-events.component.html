<div class="admin-page">
    <div class="page-header">
      <h1>All Events</h1>
      <a (click)="createEvent()" class="btn btn-primary create-btn">
        <i class="bi bi-plus-lg"></i> Create Event
      </a>
    </div>

    <app-grid
      [columns]="columns"
      [data]="events"
      [totalRecords]="totalRecords"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      [trackByField]="'id'"
      [isLoading]="loading"
      [errorMessage]="error"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
      (toggle)="onToggleVerify($event)"
      (edit)="onEdit($event)"
      (delete)="promptDelete($event)"
    />

    <app-confirmation-modal
      [isOpen]="!!confirmEvent"
      title="Delete Event"
      [message]="'Delete ' + (confirmEvent?.title || 'event') + '? This action cannot be undone.'"
      confirmLabel="Delete"
      confirmButtonClass="btn-danger"
      (confirmed)="onDeleteConfirmed()"
      (cancelled)="onDeleteCancelled()"
    />
</div>
