<div class="organizer-shell">
    <app-header />
    <div class="organizer-body">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a class="nav-item" routerLink="/organizer/dashboard" routerLinkActive="active"
                    [routerLinkActiveOptions]="{exact: true}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                    Dashboard
                </a>
                <a class="nav-item" routerLink="/organizer/events" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                    </svg>
                    My Events
                </a>
                <a class="nav-item" routerLink="/organizer/events/create" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Create Event
                </a>
                <a class="nav-item" routerLink="/organizer/attendees" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                    </svg>
                    Attendees
                </a>
                <a class="nav-item" routerLink="/organizer/analytics" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                    Sales Analytics
                </a>
                <a class="nav-item" routerLink="/organizer/check-in" routerLinkActive="active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 11 12 14 22 4" />
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                    </svg>
                    Check-in
                </a>
            </nav>
        </aside>
        <main class="main-content">
            <router-outlet />
        </main>
    </div>
</div>
