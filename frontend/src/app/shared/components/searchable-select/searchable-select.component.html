<div class="searchable-select">
  @if (label) {
    <label class="form-label text-uppercase fw-semibold text-muted small mb-1">{{ label }}</label>
  }
  <div class="custom-select">
    <button type="button" class="custom-select-trigger" (click)="toggle()">
      <span>{{ displayText }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    @if (isOpen) {
      <div class="searchable-select-options">
        <div class="searchable-select-search">
          <input
            #searchInput
            type="text"
            class="searchable-select-input"
            [placeholder]="placeholder"
            [value]="searchText"
            (input)="onSearchInput($any($event.target).value)"
            (keydown)="onKeydown($event)"
          />
        </div>
        <div class="searchable-select-list">
          @if (loading) {
            <div class="searchable-select-empty">Loading...</div>
          } @else {
            <button
              type="button"
              class="searchable-select-option"
              [class.highlighted]="highlightedIndex === -1"
              (click)="selectAll()"
            >{{ allLabel }}</button>
            @for (item of filteredItems; track item; let i = $index) {
              <button
                type="button"
                class="searchable-select-option"
                [class.selected]="value === item"
                [class.highlighted]="highlightedIndex === i"
                (click)="select(item)"
              >{{ item }}</button>
            }
            @if (filteredItems.length === 0 && !loading) {
              <div class="searchable-select-empty">No results found</div>
            }
          }
        </div>
      </div>
    }
  </div>
</div>
