<div class="event-card" [routerLink]="link" (click)="clicked.emit(event.id)">
  <div class="event-card-poster">
    @if (hasPoster) {
      <img [src]="posterSrc" [alt]="event.title" class="event-poster-img" />
    } @else {
      <div class="event-poster-placeholder">
        <img src="/images/fallback_image.png" alt="Fallback" />
      </div>
    }
    @if (event.categoryName) {
      <span class="event-card-category">{{ event.categoryName }}</span>
    }
  </div>
  <div class="event-card-body">
    <h3 class="event-card-title">{{ event.title }}</h3>
    <div class="event-card-meta">
      <span class="meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg>
        {{ event.eventDate | date:'MMM d, yyyy' }}
      </span>
      <span class="meta-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 6v6l4 2" />
        </svg>
        {{ formatTime(event.startTime) }}
      </span>
      @if (event.venueName) {
        <span class="meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z" />
            <circle cx="12" cy="10" r="3" />
          </svg>
          {{ event.venueName }}
        </span>
      }
    </div>
    <div class="event-card-footer">
      <span class="event-card-price">{{ event.price | currency:'INR':'symbol':'1.2-2' }}</span>
    </div>
  </div>
</div>
